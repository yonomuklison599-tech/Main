<!doctype html>
<html><head><meta charset="utf-8"><title>Pont suspendu</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="events.js"></script></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Rendu déterministe : window.render(t) dessine l'image à l'instant t (secondes vidéo).
const W = 1080, H = 1920, CY = 860;
const cv = document.getElementById('c'), g = cv.getContext('2d');
let WORDS = [], GROUPS = [];
window.setTiming = d => { WORDS = d.words; GROUPS = buildGroups(WORDS); };

// ---------- utilitaires ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeIn = k => Math.pow(clamp(k), 2.2);
const easeBack = k => { k = clamp(k); const c = 2.2; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const win = (t, a, b, f = .25) => seg(t, a, a + f) * (1 - seg(t, b - f, b));
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

const C = {
  grass: '#6cc04a', grassDark: '#4f9a36', dirt: '#a8713f', dirtDark: '#7d5230', sand: '#e2c58b',
  water: '#27a8cf', waterDeep: '#15607e', wood: '#d79a52', woodDark: '#9c6631', stone: '#a9a49c', stoneDark: '#7a756d',
  steel: '#e0532f', steelDark: '#a8361c', cable: '#2b2f3a', concrete: '#c9c6bf', concreteDark: '#9b978e',
  asphalt: '#3b3f48', navy: '#14213d', yellow: '#ffd23f', red: '#ff3b3b', white: '#ffffff',
  body: '#f0a23c', bodyShade: '#c47b22', hat: '#2f6fe0', hatShade: '#1f4fa8'
};

// ---------- monde ----------
const BANK = 500, BED = 440, TOWER_H = 560, ANCH = 860;
const HANG_X = []; for (let x = -420; x <= 420; x += 70) HANG_X.push(x);
const LAMP_X = [-360, -240, -120, 0, 120, 240, 360];
const T = {}; for (const k in EV) T[k] = EV[k] + VO;   // temps vidéo

// ---------- caméra ----------
const KEYS = [ // [t voix, x, y, zoom, durée transition]
  [0, 0, -60, 1.0, 0], [3.85, -200, -40, 1.45, .45], [5.2, 0, 10, 1.8, .5], [6.4, 0, 120, 1.45, .3],
  [7.15, 0, -40, 1.0, .4], [9.45, 0, -60, 1.12, .4], [12.85, 0, 10, 0.95, .5], [15.3, 60, 90, 1.4, .4],
  [16.9, 0, -230, 0.8, .5], [22.7, -260, -110, 1.3, .45], [23.9, 260, -110, 1.3, 1.1], [25.85, -440, -420, 1.45, .45],
  [27.3, 0, -240, 0.82, .35], [29.2, 0, -230, 0.54, .5], [34.05, 0, -230, 0.62, .3], [36.2, 0, -150, 0.9, .4],
  [38.5, 0, -20, 1.2, .6], [40.1, 0, 60, 1.0, .3], [40.95, 0, -180, 0.78, .3], [44.85, 0, -60, 1.05, .4],
  [46.4, -280, -10, 1.5, .4], [46.8, 280, -10, 1.5, .9], [47.7, 0, -120, 0.95, .4], [49.0, -300, -40, 1.45, .4],
  [50.5, 300, -60, 1.3, 1.2], [51.7, 0, -40, 1.2, .4], [52.9, 0, -270, 0.62, 1.6]
];
const PUNCH = ['pontLabel', 'snap', 'pillarLand', 'half', 'eight', 'thunder', 'sweep', 'tower1', 'tower2', 'cableEnd', 'hangLabel',
  'lean', 'anchorLand', 'ctaDing', 'collapse', 'stamp', 'trussEnd', 'holds', 'bravo', 'plankLand'];
const SHAKE = [['snap', 14], ['thunder', 10], ['sweep', 14], ['lean', 12], ['anchorLand', 16], ['collapse', 18], ['pillarLand', 8], ['plankLand', 6]];
function camera(t) {
  const tv = t - VO; let cur = KEYS[0], x = cur[1], y = cur[2], z = cur[3];
  for (let i = 1; i < KEYS.length; i++) {
    const k = KEYS[i]; if (tv < k[0]) break;
    const p = ease(seg(tv, k[0], k[0] + k[4]));
    x = lerp(x, k[1], p); y = lerp(y, k[2], p); z = lerp(z, k[3], p); cur = k;
  }
  z *= 1 + .025 * (tv - cur[0]);                     // poussée lente permanente
  for (const n of PUNCH) if (t > T[n]) z *= 1 + .07 * Math.exp(-(t - T[n]) * 7);
  let sx = 0, sy = 0;
  for (const [n, a] of SHAKE) if (t > T[n]) { const e = a * Math.exp(-(t - T[n]) * 6); sx += Math.sin(t * 91) * e; sy += Math.cos(t * 77) * e; }
  return { x, y, z, sx, sy };
}
let CAM;
const toScreen = (x, y) => [540 + (x - CAM.x) * CAM.z + CAM.sx, CY + (y - CAM.y) * CAM.z + CAM.sy];
function worldTransform() { g.setTransform(CAM.z, 0, 0, CAM.z, 540 - CAM.x * CAM.z + CAM.sx, CY - CAM.y * CAM.z + CAM.sy); }

// ---------- état du monde ----------
function waterY(t) { return 170 - 95 * ease(seg(t, T.rise, T.rise + .8)) + 95 * ease(seg(t, T.clear, T.clear + .9)); }
function storm(t) { return ease(seg(t, T.storm, T.storm + .7)) * (1 - ease(seg(t, T.clear, T.clear + .6))); }
function sunset(t) { return ease(seg(t, T.bravo - .3, T.bravo + 1.6)); }
function towerLean(t) { return .19 * ease(seg(t, T.lean, T.leanEnd)) * (1 - ease(seg(t, T.fix, T.fix + .5))); }
function towerTop(side, t) { const t0 = side < 0 ? T.tower1 : T.tower2, h = TOWER_H * easeBack(seg(t, t0, t0 + .4)), a = -side * towerLean(t);
  return [side * BANK + h * Math.sin(a), 6 - h * Math.cos(a)]; }
function cableSag(t) { return -90 + 150 * ease(seg(t, T.lean, T.leanEnd)) * (1 - ease(seg(t, T.fix, T.fix + .5))); }
function cableAt(x, t) { // y du câble principal entre les tours
  const [lx, ly] = towerTop(-1, t), [rx, ry] = towerTop(1, t), m = cableSag(t);
  const u = clamp((x - lx) / (rx - lx)); // courbe de Bézier quadratique ~ parabole
  const cy = 2 * m - (ly + ry) / 2;
  return (1 - u) * (1 - u) * ly + 2 * u * (1 - u) * cy + u * u * ry;
}
// déformation du tablier suspendu (vent)
function deckWave(x, t) {
  if (t < T.wind || t > T.collapse + 3) return [0, 0];
  const A = 46 * ease(seg(t, T.wobble, T.twist)), tw = 16 * ease(seg(t, T.twist - .4, T.collapse));
  const dy = A * Math.sin(Math.PI * 2 * (x + BANK) / (2 * BANK)) * Math.sin(t * 7.5);
  const th = tw * Math.sin(Math.PI * (x + BANK) / (2 * BANK) * 2) * Math.sin(t * 9);
  return [dy, th];
}

// ---------- décor ----------
const clouds = []; { const r = rng(4); for (let i = 0; i < 9; i++) clouds.push({ x: r() * 2400 - 600, y: 120 + r() * 480, s: .6 + r() * .9, v: 8 + r() * 14 }); }
const trees = []; { const r = rng(8); for (let i = 0; i < 40; i++) { const side = i % 2 ? 1 : -1; trees.push({ x: side * (560 + r() * 1700), s: .7 + r() * .7, h: r() }); } }
function sky(t) {
  const st = storm(t), ss = sunset(t);
  const top = mix3(['#69c3ff', '#2e3c4d', '#ff8a5c'], st, ss), bot = mix3(['#d8f1ff', '#59697a', '#ffd7a1'], st, ss);
  const sg = g.createLinearGradient(0, 0, 0, H); sg.addColorStop(0, top); sg.addColorStop(.55, bot); sg.addColorStop(1, bot);
  g.fillStyle = sg; g.fillRect(0, 0, W, H);
  if (ss > 0) { g.fillStyle = `rgba(255,220,140,${.8 * ss})`; g.beginPath(); g.arc(780, 640 + 120 * (1 - ss), 110, 0, 7); g.fill(); }
  for (const c of clouds) {
    const x = ((c.x + t * c.v - CAM.x * .15) % 2400 + 2400) % 2400 - 600, y = c.y;
    g.fillStyle = st > 0 ? `rgba(${lerp(255, 90, st)},${lerp(255, 100, st)},${lerp(255, 115, st)},.95)` : 'rgba(255,255,255,.92)';
    for (const [dx, dy, r] of [[0, 0, 60], [55, -25, 70], [115, 0, 55], [55, 15, 60]]) { g.beginPath(); g.arc(x + dx * c.s, y + dy * c.s, r * c.s, 0, 7); g.fill(); }
  }
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function mixC(a, b, k) { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }
function mix3(c, st, ss) { const A = hexToRgb(c[0]), B = hexToRgb(c[1]), S = hexToRgb(c[2]);
  return `rgb(${A.map((v, i) => Math.round(lerp(lerp(v, B[i], st), S[i], ss))).join(',')})`; }

function hills(t) {
  const st = storm(t), ss = sunset(t);
  const layers = [[.25, -260, '#9fd88a', 140], [.45, -150, '#7cc66a', 110]];
  for (const [par, base, col, amp] of layers) {
    const [, sy] = toScreen(0, base);
    g.fillStyle = mix3([col, '#4b5a55', '#c9a070'], st * .8, ss * .5);
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) { const wx = (x - 540) / CAM.z * par + CAM.x * par; g.lineTo(x, sy + (Math.sin(wx * .004) * amp + Math.sin(wx * .011) * amp * .3) * CAM.z * .6 - amp * .5); }
    g.lineTo(W, H); g.fill();
  }
}

function tree(x, s, col) {
  g.fillStyle = '#7a4f2a'; g.fillRect(x - 7 * s, -70 * s, 14 * s, 70 * s);
  g.fillStyle = col; g.beginPath(); g.arc(x, -100 * s, 52 * s, 0, 7); g.arc(x - 34 * s, -72 * s, 36 * s, 0, 7); g.arc(x + 34 * s, -72 * s, 36 * s, 0, 7); g.fill();
}

function ground(t) {
  const wy = waterY(t), st = storm(t);
  // eau
  const wg = g.createLinearGradient(0, wy, 0, BED); wg.addColorStop(0, mixC(C.water, '#3d6b78', st)); wg.addColorStop(1, mixC(C.waterDeep, '#1d3640', st));
  g.fillStyle = wg; g.fillRect(-BANK - 40, wy, 2 * BANK + 80, BED - wy + 5);
  // fond sableux
  g.fillStyle = C.sand; g.fillRect(-BANK - 40, BED, 2 * BANK + 80, 2000);
  g.fillStyle = 'rgba(0,0,0,.08)'; for (let x = -460; x < 460; x += 60) { g.beginPath(); g.ellipse(x + 20, BED + 10, 22, 7, 0, 0, 7); g.fill(); }
  // berges
  for (const s of [-1, 1]) {
    g.fillStyle = C.dirt; g.beginPath();
    g.moveTo(s * BANK, 0); g.bezierCurveTo(s * (BANK - 10), 160, s * (BANK - 70), 300, s * (BANK - 90), BED + 4);
    g.lineTo(s * (BANK - 90), 2200); g.lineTo(s * 4000, 2200); g.lineTo(s * 4000, 0); g.closePath(); g.fill();
    g.fillStyle = C.dirtDark; for (let i = 0; i < 26; i++) { const r = rng(i + (s > 0 ? 50 : 0)); const x = s * (BANK + 40 + r() * 2200), y = 60 + r() * 700; g.beginPath(); g.ellipse(x, y, 16 + r() * 18, 9 + r() * 8, 0, 0, 7); g.fill(); }
    g.fillStyle = mixC(C.grass, '#56704a', st); g.fillRect(s > 0 ? BANK : -4000, -4, 4000 - BANK, 26);
    g.fillStyle = C.grassDark; g.fillRect(s > 0 ? BANK : -4000, 18, 4000 - BANK, 8);
  }
  for (const tr of trees) tree(tr.x, tr.s, mixC(tr.h > .5 ? '#3f9b3a' : '#55b146', '#3a5440', st));
}
function waterOverlay(t) {
  const wy = waterY(t), st = storm(t);
  g.fillStyle = `rgba(30,120,160,${.42})`; g.fillRect(-BANK + 10, wy, 2 * BANK - 20, BED - wy);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 5; g.beginPath();
  const amp = 4 + 12 * st;
  for (let x = -BANK + 20; x <= BANK - 20; x += 12) g.lineTo(x, wy + Math.sin(x * .03 + t * (3 + 4 * st)) * amp);
  g.stroke();
}

// ---------- éléments du pont ----------
function plankA(t) {
  if (t > T.pillarDrop) return;
  const land = easeIn(seg(t, T.plankDrop, T.plankLand)), y0 = lerp(-900, 0, land);
  if (t < T.snap) {
    const hx = hero(t).x, load = seg(t, T.walk, T.walkEnd) * 10 + 64 * ease(seg(t, T.bend, T.snap));
    g.fillStyle = C.wood; g.strokeStyle = C.woodDark; g.lineWidth = 5;
    g.beginPath();
    for (let x = -BANK - 40; x <= BANK + 40; x += 20) g.lineTo(x, y0 + sagA(x, hx, load) - 22);
    for (let x = BANK + 40; x >= -BANK - 40; x -= 20) g.lineTo(x, y0 + sagA(x, hx, load));
    g.closePath(); g.fill(); g.stroke();
    if (t > T.bend) { g.strokeStyle = 'rgba(90,50,20,.8)'; g.lineWidth = 4; g.beginPath(); const k = seg(t, T.bend + .4, T.snap);
      g.moveTo(-6, sagA(0, hx, load) - 2); g.lineTo(6, sagA(0, hx, load) - 10 * k); g.lineTo(-4, sagA(0, hx, load) - 18 * k); g.stroke(); }
  } else {
    const k = seg(t, T.snap, T.snap + .55), fall = Math.max(0, t - T.snap - .45);
    for (const s of [-1, 1]) {
      g.save(); g.translate(s * BANK, 0 + fall * fall * 900); g.rotate(s * 1.25 * easeIn(k) + s * fall * .4);
      g.fillStyle = C.wood; g.strokeStyle = C.woodDark; g.lineWidth = 5;
      const x0 = s < 0 ? -40 : -BANK, w = BANK + 40;
      g.beginPath(); g.rect(s < 0 ? -40 : -BANK, -22, w, 22); g.fill(); g.stroke();
      // bout éclaté
      g.beginPath(); const e = s < 0 ? BANK : -BANK; g.moveTo(e, -22); g.lineTo(e + s * 14, -14); g.lineTo(e, -8); g.lineTo(e + s * 10, 0); g.lineTo(e, 0); g.fill();
      g.restore();
    }
  }
}
function sagA(x, hx, load) { const u = (x + BANK) / (2 * BANK); if (u < 0 || u > 1) return 0;
  const m = clamp((hx + BANK) / (2 * BANK), .05, .95); return load * (u < m ? Math.sin(u / m * Math.PI / 2) : Math.sin((1 - u) / (1 - m) * Math.PI / 2)); }

function pillarB(t) {
  if (t < T.pillarDrop || t > T.clear + 1) return;
  const land = easeIn(seg(t, T.pillarDrop, T.pillarLand));
  const sw = ease(seg(t, T.sweep, T.sweepEnd));
  g.save(); g.translate(0 + sw * 700, lerp(-1100, 0, land) + sw * 160); g.rotate(sw * 1.1);
  g.fillStyle = C.stone; rr(-40, 0, 80, BED + 10, 6); g.fill();
  g.fillStyle = C.stoneDark; for (let y = 30; y < BED; y += 60) { g.fillRect(-40, y, 80, 5); g.fillRect((y / 60 % 2 ? -10 : 12), y - 55, 5, 55); }
  g.fillStyle = '#bdb8b0'; rr(-52, -6, 104, 18, 6); g.fill();
  g.restore();
}
function planksB(t) {
  if (t < T.planksLand - .35 || t > T.clear + 1) return;
  const land = easeIn(seg(t, T.planksLand - .35, T.planksLand)), y0 = lerp(-700, -6, land);
  const sw = seg(t, T.sweep + .1, T.sweep + .6), fall = Math.max(0, t - T.sweep - .5);
  for (const s of [-1, 1]) {
    g.save(); g.translate(s * BANK, y0 + fall * fall * 900); g.rotate(s * 1.2 * easeIn(sw));
    g.fillStyle = C.wood; g.strokeStyle = C.woodDark; g.lineWidth = 5;
    g.beginPath(); g.rect(s < 0 ? -40 : -BANK - 4, -18, BANK + 44, 18); g.fill(); g.stroke();
    g.restore();
  }
}

function towers(t) {
  if (t < T.tower1) return;
  for (const s of [-1, 1]) {
    const t0 = s < 0 ? T.tower1 : T.tower2; if (t < t0) continue;
    const h = TOWER_H * easeBack(seg(t, t0, t0 + .4));
    g.save(); g.translate(s * BANK, 6); g.rotate(-s * towerLean(t));
    g.fillStyle = C.steel; rr(-26, -h, 52, h, 6); g.fill();
    g.fillStyle = C.steelDark; g.fillRect(8, -h, 18, h);
    for (const k of [.3, .62]) { g.fillStyle = C.steelDark; g.fillRect(-34, -h * k - 10, 68, 20); }
    g.fillStyle = C.steelDark; rr(-34, -h - 18, 68, 26, 8); g.fill();
    g.restore();
    // socle béton
    g.fillStyle = C.concrete; rr(s * BANK - 50, -2, 100, 34, 6); g.fill();
  }
}
function mainCable(t) {
  if (t < T.cable) return;
  const p = ease(seg(t, T.cable, T.cableEnd)), [lx] = towerTop(-1, t), [rx] = towerTop(1, t);
  g.strokeStyle = C.cable; g.lineWidth = 9; g.lineCap = 'round'; g.beginPath();
  for (let i = 0; i <= 60 * p; i++) { const x = lerp(lx, rx, i / 60); g.lineTo(x, cableAt(x, t)); }
  g.stroke();
  // haubans arrière vers les ancrages
  if (t > T.back) {
    const q = ease(seg(t, T.back, T.backEnd));
    for (const s of [-1, 1]) { const [tx, ty] = towerTop(s, t); const ex = s * ANCH, ey = 40;
      g.beginPath(); g.moveTo(tx, ty); const mx = lerp(tx, ex, q), my = lerp(ty, ey, q) + Math.sin(q * Math.PI) * 30; g.quadraticCurveTo(lerp(tx, mx, .5), lerp(ty, my, .5) + 30 * q, mx, my); g.stroke(); }
  }
}
function anchors(t) {
  if (t < T.anchor) return;
  const k = easeIn(seg(t, T.anchor, T.anchorLand));
  for (const s of [-1, 1]) {
    const x = s * ANCH, y = lerp(-900, 20, k);
    g.fillStyle = 'rgba(60,35,15,.5)'; rr(x - 86, 14, 172, 130, 8); g.fill();
    g.fillStyle = C.concrete; rr(x - 78, y, 156, 116, 10); g.fill();
    g.fillStyle = C.concreteDark; g.fillRect(x - 78, y + 86, 156, 30);
    g.fillStyle = 'rgba(0,0,0,.15)'; for (const d of [-40, 0, 40]) { g.beginPath(); g.arc(x + d, y + 40, 5, 0, 7); g.fill(); }
  }
}

function deckPieces(t) { // morceaux du tablier qui tombent après l'effondrement
  const out = [], r = rng(21);
  for (let x = -330; x < 330; x += 110) out.push({ x0: x, x1: x + 110, vx: (r() - .5) * 120, rot: (r() - .5) * 2.4, d: r() * .25 });
  return out;
}
const PIECES = deckPieces();
function deckC(t) {
  if (t < T.deck) return;
  const slide = t < T.newDeck ? (1 - easeOut(seg(t, T.deck, T.deck + .45))) * -1700 : (1 - easeOut(seg(t, T.newDeck, T.newDeck + .45))) * 1700;
  const collapsed = t > T.collapse && t < T.newDeck;
  if (t > T.tacomaEnd && t < T.newDeck) return;
  const stiff = t > T.newDeck;
  g.save(); g.translate(slide, 0);
  // suspentes
  for (let i = 0; i < HANG_X.length; i++) {
    const x = HANG_X[i], k = ease(seg(t, T.hangers + i * (T.hangersEnd - T.hangers) / HANG_X.length, T.hangers + (i + 1) * (T.hangersEnd - T.hangers) / HANG_X.length));
    if (k <= 0) continue;
    if (collapsed && Math.abs(x) < 330) { // suspentes rompues qui pendent
      const cy = cableAt(x, t); g.strokeStyle = C.cable; g.lineWidth = 3; g.beginPath(); g.moveTo(x, cy); g.lineTo(x + Math.sin(t * 3 + x) * 10, cy + 90); g.stroke(); continue; }
    const cy = cableAt(x - slide, t), [dy] = stiff ? [0] : deckWave(x, t);
    g.strokeStyle = C.cable; g.lineWidth = 3.5; g.beginPath(); g.moveTo(x, cy); g.lineTo(x, lerp(cy, dy - 16, k)); g.stroke();
  }
  // poutre treillis
  if (stiff && t > T.truss) {
    const p = ease(seg(t, T.truss, T.trussEnd)), xm = lerp(-760, 760, p);
    g.strokeStyle = C.steelDark; g.lineWidth = 7; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(-760, 58); g.lineTo(xm, 58); g.stroke();
    g.beginPath(); let up = true; for (let x = -760; x <= xm; x += 60) { g.lineTo(x, up ? 4 : 58); up = !up; } g.stroke();
    g.lineWidth = 4; for (let x = -760; x <= xm; x += 120) { g.beginPath(); g.moveTo(x, 4); g.lineTo(x, 58); g.stroke(); }
  }
  // tablier
  const vib = stiff ? Math.sin(t * 40) * 1.5 * win(t, T.wind2, T.wind2End) : 0;
  const drawStrip = (a, b) => {
    g.fillStyle = '#cfd3da'; g.strokeStyle = '#7d8592'; g.lineWidth = 4; g.beginPath();
    for (let x = a; x <= b; x += 12) { const [dy, th] = stiff ? [vib, 0] : deckWave(x, t); g.lineTo(x, dy - 16 - th); }
    for (let x = b; x >= a; x -= 12) { const [dy, th] = stiff ? [vib, 0] : deckWave(x, t); g.lineTo(x, dy + 6 + th); }
    g.closePath(); g.fill(); g.stroke();
  };
  if (!collapsed) drawStrip(-760, 760);
  else {
    drawStrip(-760, -330); drawStrip(330, 760);
    const dt = t - T.collapse;
    for (const p of PIECES) {

    if (y > H + 40) continue; g.save(); g.translate(x, y); g.rotate(sp * tt); g.fillStyle = c; g.fillRect(-9, -5, 18, 10); g.restore(); }
}
function grade(t) {
  // Tacoma : archive sépia
  const sep = win(t, T.tacoma, T.tacomaEnd, .2);
  if (sep > 0) {
    g.save(); g.globalAlpha = sep; g.globalCompositeOperation = 'saturation'; g.fillStyle = '#808080'; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'multiply'; g.fillStyle = '#e2c79a'; g.fillRect(0, 0, W, H); g.restore();
    g.save(); g.globalAlpha = sep * .5; const r = rng(Math.floor(t * 24));
    g.fillStyle = '#000'; for (let i = 0; i < 40; i++) g.fillRect(r() * W, r() * H, 2, 2 + r() * 6);
    g.strokeStyle = 'rgba(40,30,20,.6)'; g.lineWidth = 2; g.beginPath(); const lx = r() * W; g.moveTo(lx, 0); g.lineTo(lx + 4, H); g.stroke(); g.restore();
  }
  // éclair
  const fl = t > T.thunder ? Math.exp(-(t - T.thunder) * 9) : 0;
  const fl2 = t > T.bravo ? .6 * Math.exp(-(t - T.bravo) * 7) : 0;
  if (fl + fl2 > .01) { g.fillStyle = `rgba(255,255,255,${Math.min(.85, fl + fl2)})`; g.fillRect(0, 0, W, H); }
  // vignette
  const v = g.createRadialGradient(540, 900, 520, 540, 960, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.35)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  // sortie : coupe nette en boucle (pas de fondu au noir)
}

window.DURATION = T.end;
window.render = function (t) {

  g.setTransform(1, 0, 0, 1, 0, 0);

  anchors(t);

  towers(t); mainCable(t);

  splashAt(t, T.sweep + .7, 300, 20, .8);
  currentArrows(t); windStreaks(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
